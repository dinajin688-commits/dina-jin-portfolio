<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>金凤善作品集</title><style>html,body{margin:0;min-height:100%;background:#09090b;color:#eee;font:16px Arial,sans-serif}body{display:grid;place-items:center}.loading{opacity:.8}</style></head><body><div class="loading">作品集加载中…</div><script>(async()=>{const names=["portfolio-v13.part1","portfolio-v13.part2"];const chunks=await Promise.all(names.map(async n=>{const r=await fetch(n);if(!r.ok)throw new Error("无法读取作品集资源："+n);return new Uint8Array(await r.arrayBuffer())}));const size=chunks.reduce((a,c)=>a+c.length,0);const bytes=new Uint8Array(size);let offset=0;for(const c of chunks){bytes.set(c,offset);offset+=c.length}const html=new TextDecoder("utf-8").decode(bytes);document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML="<p style=\"font:16px Arial;color:#fff;padding:32px\">作品集暂时无法加载，请刷新页面。<br><small>"+String(e.message)+"</small></p>"})})();</script></body></html>
